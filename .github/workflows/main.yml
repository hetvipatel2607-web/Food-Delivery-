
name: Food Delivery CI-CD

on:
  push:
    branches:
      - main
      - feature-food-menu
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Run Tests
        run: npm test --if-present

      - name: Package Application
        run: tar -czf food-delivery-build.tar.gz dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: food-delivery-build
          path: food-delivery-build.tar.gz
